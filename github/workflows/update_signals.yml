name: Update Signals

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r scripts/requirements.txt

      - name: 신호 스캔 실행
        run: python scripts/generate_signals.py

      - name: 새 신호가 있으면 푸시 알림 발송
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: |
          if [ "$(cat data/new_alerts.json)" != "[]" ]; then
            python scripts/send_push.py
          else
            echo "새 신호 없음, 알림 생략"
          fi

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "tajeom-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/signals.json data/state.json data/new_alerts.json data/market_names.json data/trade_history.json
          git diff --quiet --cached || git commit -m "signals update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
